name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: plugins/stack matches upstream + patches + overlay
        run: python3 tools/stack.py check
      - name: every reference resolves
        run: python3 tools/stack.py verify
      - name: behavior tests
        run: python3 -m unittest discover -s tests -v
